[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scenario-studio"
version = "0.1.0"
description = "Modular NCAP scenario analysis tool with interactive dashboard"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Lais Diman", email = "laisdiman@gmail.com"}
]
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/laisdiman/scenario-studio"
Documentation = "https://github.com/laisdiman/scenario-studio"
Repository = "https://github.com/laisdiman/scenario-studio.git"
Issues = "https://github.com/laisdiman/scenario-studio/issues"

[tool.setuptools]
packages = ["scenario_studio", "scenario_studio.analyzers"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
